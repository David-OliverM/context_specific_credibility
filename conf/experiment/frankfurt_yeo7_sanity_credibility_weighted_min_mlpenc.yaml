name: "frankfurt/yeo7_sanity_credibility_weighted_min_mlpenc"
classification: True
multilabel: False
dataset:
  name: "frankfurt"
  path: "${data_dir}/neuro_data_UKF"
  args:
    modality_grouping: "yeo7"
    n_splits: 3
    fold: 0
  modalities: 9
  batch_size: ${batch_size}
  num_classes: 3
  class_names: ["Amisulpride", "LDopa", "Placebo"]

encoders:
  VIS:
    type: "MLPEncoder"
    args: {in_dim: 153, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}
  SOMMOT:
    type: "MLPEncoder"
    args: {in_dim: 153, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}
  DORSATTN:
    type: "MLPEncoder"
    args: {in_dim: 28, embed_dim: 64, n_layers: 2, n_hidden: 64, dropout: 0.2}
  VENTATTN:
    type: "MLPEncoder"
    args: {in_dim: 21, embed_dim: 64, n_layers: 2, n_hidden: 64, dropout: 0.2}
  LIMBIC:
    type: "MLPEncoder"
    args: {in_dim: 120, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}
  CONT:
    type: "MLPEncoder"
    args: {in_dim: 28, embed_dim: 64, n_layers: 2, n_hidden: 64, dropout: 0.2}
  DEFAULT:
    type: "MLPEncoder"
    args: {in_dim: 120, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}
  SUBCORTICAL:
    type: "MLPEncoder"
    args: {in_dim: 105, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}
  CEREBELLAR:
    type: "MLPEncoder"
    args: {in_dim: 325, embed_dim: 64, n_layers: 2, n_hidden: 128, dropout: 0.2}

predictors:
  VIS:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  SOMMOT:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  DORSATTN:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  VENTATTN:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  LIMBIC:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  CONT:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  DEFAULT:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  SUBCORTICAL:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}
  CEREBELLAR:
    type: "Classifier"
    args: {in_dim: 64, out_dim: 3, n_layers: 1, n_hidden: 64}

# C²MF (min) — small Einet + small hypernetwork. in_dim = 9*64 = 576.
head:
  type: "CredibilityWeightedMean"
  threshold_input: False
  args:
    num_features: ${experiment.dataset.modalities}
    num_channels: 1
    depth: 1
    num_sums: 2
    num_leaves: 2
    num_repetitions: 1
    num_classes: ${experiment.dataset.num_classes}
    leaf_type: 'Dirichlet'
    leaf_kwargs:
      num_classes: ${experiment.dataset.num_classes}
    einet_mixture: False
    layer_type: 'einsum'
    dropout: 0.0
    conditional_sum: True
    sum_cond_fn_type: 'Classifier'
    sum_cond_fn_args:
      in_dim: 576
      n_layers: 1
      n_hidden: 16
      final_activation: None
      out_dim: None
