name: "frankfurt/dopamine_M3_sanity_credibility_weighted_mlpenc"
classification: True
multilabel: False
dataset:
  name: "frankfurt"
  path: "${data_dir}/neuro_data_UKF"
  args:
    modality_grouping: "dopamine_M3"
    n_splits: 3
    fold: 0
  modalities: 3
  batch_size: ${batch_size}
  num_classes: 3
  class_names: ["Amisulpride", "LDopa", "Placebo"]

encoders:
  dorsal_striatum:
    type: "MLPEncoder"
    args:
      in_dim: 6
      embed_dim: 64
      n_layers: 2
      n_hidden: 64
      dropout: 0.2

  ventral_striatum:
    type: "MLPEncoder"
    args:
      in_dim: 1
      embed_dim: 64
      n_layers: 2
      n_hidden: 32
      dropout: 0.2

  da_projection_cortex:
    type: "MLPEncoder"
    args:
      in_dim: 78
      embed_dim: 64
      n_layers: 2
      n_hidden: 128
      dropout: 0.2

predictors:
  dorsal_striatum:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64

  ventral_striatum:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64

  da_projection_cortex:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64

head:
  type: "CredibilityWeightedMean"
  threshold_input: False
  args:
    num_features: ${experiment.dataset.modalities}
    num_channels: 1
    depth: 1
    num_sums: 20
    num_leaves: 20
    num_repetitions: 20
    num_classes: ${experiment.dataset.num_classes}
    leaf_type: 'Dirichlet'
    leaf_kwargs:
      num_classes: ${experiment.dataset.num_classes}
    einet_mixture: False
    layer_type: 'einsum'
    dropout: 0.2
    conditional_sum: True
    sum_cond_fn_type: 'Classifier'
    sum_cond_fn_args:
      in_dim: 192
      n_layers: 3
      n_hidden: 64
      final_activation: None
      out_dim: None
