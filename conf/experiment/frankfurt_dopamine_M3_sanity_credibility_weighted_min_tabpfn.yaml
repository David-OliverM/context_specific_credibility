name: "frankfurt/dopamine_M3_sanity_credibility_weighted_min_tabpfn"
classification: True
multilabel: False
dataset:
  name: "frankfurt"
  path: "${data_dir}/neuro_data_UKF"
  args:
    modality_grouping: "dopamine_M3"
    n_splits: 3
    fold: 0
    emit_timeseries: True
  modalities: 3
  batch_size: ${batch_size}
  num_classes: 3
  class_names: ["Amisulpride", "LDopa", "Placebo"]

encoders:
  dorsal_striatum:
    type: "TabPFNSAXEncoder"
    args:
      roi_indices: [93, 94, 95, 96]
      embed_dim: 64
      sax_alphabet: 4
      sax_word_size: 8
      sax_strategy: "quantile"
      n_classes: ${experiment.dataset.num_classes}
      tabpfn_device: "cpu"
      random_state: 42
  ventral_striatum:
    type: "TabPFNSAXEncoder"
    args:
      roi_indices: [103, 104]
      embed_dim: 64
      sax_alphabet: 4
      sax_word_size: 8
      sax_strategy: "quantile"
      n_classes: ${experiment.dataset.num_classes}
      tabpfn_device: "cpu"
      random_state: 42
  da_projection_cortex:
    type: "TabPFNSAXEncoder"
    args:
      roi_indices: [4, 5, 6, 7, 48, 51, 52, 53, 54, 59, 60, 101, 102]
      embed_dim: 64
      sax_alphabet: 4
      sax_word_size: 8
      sax_strategy: "quantile"
      n_classes: ${experiment.dataset.num_classes}
      tabpfn_device: "cpu"
      random_state: 42

predictors:
  dorsal_striatum:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64
  ventral_striatum:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64
  da_projection_cortex:
    type: "Classifier"
    args:
      in_dim: 64
      out_dim: ${experiment.dataset.num_classes}
      n_layers: 1
      n_hidden: 64

# C²MF in der KLEINST-MÖGLICHEN Konfiguration: depth=1, num_sums=2,
# num_leaves=2, num_repetitions=1, dropout=0.0. sum_cond_fn auf 1-Layer
# n_hidden=16 reduziert. conditional_sum=True bleibt (sonst kein C²MF).
head:
  type: "CredibilityWeightedMean"
  threshold_input: False
  args:
    num_features: ${experiment.dataset.modalities}
    num_channels: 1
    depth: 1
    num_sums: 2
    num_leaves: 2
    num_repetitions: 1
    num_classes: ${experiment.dataset.num_classes}
    leaf_type: 'Dirichlet'
    leaf_kwargs:
      num_classes: ${experiment.dataset.num_classes}
    einet_mixture: False
    layer_type: 'einsum'
    dropout: 0.0
    conditional_sum: True
    sum_cond_fn_type: 'Classifier'
    sum_cond_fn_args:
      in_dim: 192
      n_layers: 1
      n_hidden: 16
      final_activation: None
      out_dim: None
